name: One-time RSVP save verification
on:
  push:
    paths:
      - ".github/workflows/e2e-wedding-one-time.yml"
jobs:
  test-submit:
    if: github.event.head_commit.message == 'Start one-time RSVP end-to-end test'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e-one-time.js
